<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>やることウォッチ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <h1>やることウォッチ</h1>
    <div class="header-right">
      <div class="total-panel">
        <span class="caption">合計</span>
        <span class="value" id="totalTime">00:00:00</span>
      </div>
      <button id="resetAllBtn" class="btn btn-reset-all">全リセット</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-page="0" type="button">タイマー</button>
    <button class="tab-btn" data-page="1" type="button">内訳</button>
    <button class="tab-btn" data-page="2" type="button">履歴</button>
  </nav>

  <div class="pages" id="pages">
    <section class="page">
      <main id="grid" class="grid"></main>
    </section>
    <section class="page">
      <div id="breakdown" class="breakdown"></div>
    </section>
    <section class="page">
      <div id="history" class="history"></div>
    </section>
  </div>
</div>

<div class="modal-backdrop" id="nameModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle">
    <h2 id="nameModalTitle">項目名を入力</h2>
    <input id="nameModalInput" type="text" maxlength="20">
    <div class="modal-actions">
      <button class="btn btn-modal-cancel" id="nameModalCancel" type="button">キャンセル</button>
      <button class="btn btn-modal-ok" id="nameModalOk" type="button">OK</button>
    </div>
  </div>
</div>

<template id="tileTemplate">
  <section class="tile">
    <div class="field">
      <select class="label-select"></select>
      <button class="edit-btn" type="button" title="名前を編集" hidden>&#9998;</button>
    </div>
    <div class="circle-wrap">
      <button class="circle" type="button">
        <span class="time-display">00:00:00</span>
      </button>
      <button class="reset-btn" type="button" title="リセット">&#8635;</button>
    </div>
  </section>
</template>

<script src="script.js"></script>
</body>
</html>
