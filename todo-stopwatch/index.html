<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>やることウォッチ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <h1>やることウォッチ</h1>
    <div class="header-right">
      <div class="total-panel">
        <span class="caption">合計</span>
        <span class="value" id="totalTime">00:00:00</span>
      </div>
      <button id="resetAllBtn" class="btn btn-reset-all">全リセット</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-page="0" type="button">タイマー</button>
    <button class="tab-btn" data-page="1" type="button">内訳</button>
    <button class="tab-btn" data-page="2" type="button">履歴</button>
  </nav>

  <div class="pages" id="pages">
    <section class="page">
      <div class="sidework-bar">
        <button id="foldInterruptBtn" class="side-btn fold" type="button" title="別件の時間を「割込対応」に加算し、別件をリセットします">割込対応</button>
        <div class="sidework-widget" id="sideworkWidget">
          <input class="sidework-input" id="sideworkInput" type="text" maxlength="16">
          <button class="sidework-circle" id="sideworkCircle" type="button">
            <span class="sidework-time" id="sideworkTime">00:00:00</span>
          </button>
        </div>
        <button id="deductPrevBtn" class="side-btn" type="button" title="別件の時間分を、現在進行中のウォッチの時間から差し引き、別件をリセットします">進行中<br>から差引</button>
      </div>
      <div class="list-wrap">
        <main id="list" class="list"></main>
      </div>
    </section>
    <section class="page">
      <div id="breakdown" class="breakdown"></div>
    </section>
    <section class="page">
      <div id="history" class="history"></div>
    </section>
  </div>
</div>

<template id="rowTemplate">
  <section class="row">
    <input class="row-input" type="text" maxlength="24" placeholder="タスク名">
    <span class="row-time">00:00:00</span>
    <button class="row-toggle" type="button">開始</button>
    <button class="row-reset" type="button" title="リセット">&#8635;</button>
    <button class="row-handle" type="button" title="ドラッグして並び替え" aria-label="並び替え">
      <span class="bars"><span></span><span></span><span></span></span>
    </button>
  </section>
</template>

<script src="script.js"></script>
</body>
</html>
