<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>やることウォッチ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <h1>やることウォッチ</h1>
    <div class="header-right">
      <div class="total-panel">
        <span class="caption">合計</span>
        <span class="value" id="totalTime">00:00:00</span>
      </div>
      <button id="resetAllBtn" class="btn btn-reset-all">全リセット</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-page="0" type="button">タイマー</button>
    <button class="tab-btn" data-page="1" type="button">内訳</button>
    <button class="tab-btn" data-page="2" type="button">履歴</button>
  </nav>

  <div class="pages" id="pages">
    <section class="page">
      <main id="list" class="list"></main>
    </section>
    <section class="page">
      <div id="breakdown" class="breakdown"></div>
    </section>
    <section class="page">
      <div id="history" class="history"></div>
    </section>
  </div>
</div>

<template id="rowTemplate">
  <section class="row">
    <input class="row-input" type="text" maxlength="24" placeholder="タスク名">
    <span class="row-time">00:00:00</span>
    <button class="row-toggle" type="button">開始</button>
    <button class="row-reset" type="button" title="リセット">&#8635;</button>
  </section>
</template>

<script src="script.js"></script>
</body>
</html>
