<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>やることウォッチ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <nav class="tabs" id="tabs">
    <button class="settings-btn" type="button" id="settingsTabBtn">設定</button>
    <button class="tab-btn tab-monthly" type="button">マンスリー</button>
    <button class="tab-btn tab-weekly" type="button">ウィークリー</button>
    <button class="tab-btn tab-daily" type="button">デイリー</button>
    <button class="tab-btn tab-task" type="button">ログ</button>
  </nav>

  <header class="app-header">
    <div class="header-left">
      <input type="date" id="dayPicker" class="day-picker" aria-label="日付">
      <span id="draftBadge" class="draft-badge" hidden>下書き編集中</span>
    </div>
    <div class="header-right">
      <button id="syncBtn" class="btn btn-sync" type="button" hidden></button>
      <div class="total-panel">
        <span class="caption">合計</span>
        <span class="value" id="totalTime">00:00:00</span>
      </div>
      <button id="resetAllBtn" class="btn btn-reset-all">全リセット</button>
    </div>
  </header>

  <div class="pages" id="pages">
    <div class="pages-track" id="pagesTrack">
      <section class="page">
        <div class="monthly-calendar" id="monthlyCalendar">
          <div class="calendar-header">
            <button id="monthlyPrevBtn" class="calendar-nav-btn" type="button" aria-label="前の月">&#8249;</button>
            <span id="monthlyLabel" class="calendar-month-label"></span>
            <button id="monthlyNextBtn" class="calendar-nav-btn" type="button" aria-label="次の月">&#8250;</button>
          </div>
          <div class="monthly-weekday-row" id="monthlyWeekdayRow"></div>
          <div class="monthly-weeks-scroll" id="monthlyWeeksScroll">
            <div class="monthly-weeks" id="monthlyWeeks"></div>
          </div>
          <div class="calendar-unplanned" id="monthlyUnplannedBox">
            <span class="calendar-unplanned-title">いつか</span>
            <div class="calendar-unplanned-list" id="monthlyUnplannedList"></div>
            <button type="button" class="calendar-someday-add" id="monthlySomedayAddBtn" aria-label="いつかタスクを追加">＋</button>
          </div>
          <div class="someday-branch" id="monthlySubtaskConnector" hidden></div>
          <div class="calendar-unplanned calendar-subtask-row" id="monthlySubtaskBox" hidden>
            <span class="calendar-unplanned-title">子タスク</span>
            <div class="calendar-unplanned-list" id="monthlySubtaskList"></div>
          </div>
          <div class="someday-branch" id="monthlyGrandchildConnector" hidden></div>
          <div class="calendar-unplanned calendar-subtask-row" id="monthlyGrandchildBox" hidden>
            <span class="calendar-unplanned-title">孫タスク</span>
            <div class="calendar-unplanned-list" id="monthlyGrandchildList"></div>
          </div>
          <div class="someday-branch" id="monthlyGreatGrandchildConnector" hidden></div>
          <div class="calendar-unplanned calendar-subtask-row" id="monthlyGreatGrandchildBox" hidden>
            <span class="calendar-unplanned-title">ひ孫タスク</span>
            <div class="calendar-unplanned-list" id="monthlyGreatGrandchildList"></div>
          </div>
        </div>
      </section>
      <section class="page">
        <div class="calendar">
          <div class="calendar-header">
            <button id="weeklyPrevBtn" class="calendar-nav-btn" type="button" aria-label="前の週">&#8249;</button>
            <span id="weeklyWeekLabel" class="calendar-month-label"></span>
            <button id="weeklyNextBtn" class="calendar-nav-btn" type="button" aria-label="次の週">&#8250;</button>
          </div>
          <div class="calendar-week-header" id="weeklyWeekHeader"></div>
          <div class="calendar-week-body" id="weeklyWeekBody">
            <div class="calendar-hours" id="weeklyHours"></div>
            <div class="calendar-week-grid" id="weeklyWeekGrid"></div>
          </div>
          <div class="unscheduled-week-row" id="weeklyUnscheduledRow"></div>
          <div class="calendar-unplanned" id="weeklyUnplannedBox">
            <span class="calendar-unplanned-title">いつか</span>
            <div class="calendar-unplanned-list" id="weeklyUnplannedList"></div>
            <button type="button" class="calendar-someday-add" id="weeklySomedayAddBtn" aria-label="いつかタスクを追加">＋</button>
          </div>
          <div class="someday-branch" id="weeklySubtaskConnector" hidden></div>
          <div class="calendar-unplanned calendar-subtask-row" id="weeklySubtaskBox" hidden>
            <span class="calendar-unplanned-title">子タスク</span>
            <div class="calendar-unplanned-list" id="weeklySubtaskList"></div>
          </div>
          <div class="someday-branch" id="weeklyGrandchildConnector" hidden></div>
          <div class="calendar-unplanned calendar-subtask-row" id="weeklyGrandchildBox" hidden>
            <span class="calendar-unplanned-title">孫タスク</span>
            <div class="calendar-unplanned-list" id="weeklyGrandchildList"></div>
          </div>
          <div class="someday-branch" id="weeklyGreatGrandchildConnector" hidden></div>
          <div class="calendar-unplanned calendar-subtask-row" id="weeklyGreatGrandchildBox" hidden>
            <span class="calendar-unplanned-title">ひ孫タスク</span>
            <div class="calendar-unplanned-list" id="weeklyGreatGrandchildList"></div>
          </div>
          <div id="weeklyDetail" class="calendar-detail" hidden></div>
        </div>
      </section>
      <section class="page">
        <div class="calendar">
          <div class="calendar-header">
            <button id="calendarPrevBtn" class="calendar-nav-btn" type="button" aria-label="前の日">&#8249;</button>
            <span id="calendarWeekLabel" class="calendar-month-label"></span>
            <button id="calendarNextBtn" class="calendar-nav-btn" type="button" aria-label="次の日">&#8250;</button>
          </div>
          <div class="daily-header-row">
            <div class="calendar-week-header" id="calendarWeekHeader"></div>
            <textarea id="briefingMemoInput" class="briefing-memo-input" placeholder="ブリーフィングメモ" maxlength="200"></textarea>
          </div>
          <div class="calendar-schedule-row">
            <div class="calendar-week-body" id="calendarWeekBody">
              <div class="calendar-hours" id="calendarHours"></div>
              <div class="calendar-week-grid" id="calendarWeekGrid"></div>
            </div>
            <textarea id="dailyNotesInput" class="daily-notes-input" placeholder="メモ"></textarea>
          </div>
          <div class="unscheduled-week-row" id="calendarUnscheduledRow"></div>
          <div class="calendar-unplanned" id="calendarUnplannedBox">
            <span class="calendar-unplanned-title">いつか</span>
            <div class="calendar-unplanned-list" id="calendarUnplannedList"></div>
            <button type="button" class="calendar-someday-add" id="calendarSomedayAddBtn" aria-label="いつかタスクを追加">＋</button>
          </div>
          <div class="someday-branch" id="calendarSubtaskConnector" hidden></div>
          <div class="calendar-unplanned calendar-subtask-row" id="calendarSubtaskBox" hidden>
            <span class="calendar-unplanned-title">子タスク</span>
            <div class="calendar-unplanned-list" id="calendarSubtaskList"></div>
          </div>
          <div class="someday-branch" id="calendarGrandchildConnector" hidden></div>
          <div class="calendar-unplanned calendar-subtask-row" id="calendarGrandchildBox" hidden>
            <span class="calendar-unplanned-title">孫タスク</span>
            <div class="calendar-unplanned-list" id="calendarGrandchildList"></div>
          </div>
          <div class="someday-branch" id="calendarGreatGrandchildConnector" hidden></div>
          <div class="calendar-unplanned calendar-subtask-row" id="calendarGreatGrandchildBox" hidden>
            <span class="calendar-unplanned-title">ひ孫タスク</span>
            <div class="calendar-unplanned-list" id="calendarGreatGrandchildList"></div>
          </div>
          <div id="calendarDetail" class="calendar-detail" hidden></div>
        </div>
      </section>
      <section class="page">
        <div class="task-page-header">
          <button type="button" class="tab-round-btn tab-round-breakdown" id="openBreakdownBtn">内訳</button>
          <button type="button" class="tab-round-btn tab-round-history" id="openHistoryBtn">履歴</button>
        </div>
        <div class="sidework-bar">
          <div class="sidework-widget" id="sideworkWidget">
            <input class="sidework-input" id="sideworkInput" type="text" maxlength="16">
            <button class="sidework-circle" id="sideworkCircle" type="button">
              <span class="sidework-time" id="sideworkTime">00:00:00</span>
            </button>
          </div>
          <div class="side-btn-stack">
            <button id="deductPrevBtn" class="side-btn" type="button" title="割込の時間分を、進行中のタスクから差し引きます(どこにも保存しません)">進行中<br>から差引</button>
            <button id="newTaskBtn" class="side-btn" type="button" title="割込の時間を、進行中のタスクから差し引いたうえで、名前をつけて新しいタスクとしてリストの先頭に追加します">新規タスク<br>として追加</button>
          </div>
          <div class="sidework-widget" id="choreWidget">
            <input class="sidework-input" id="choreInput" type="text" maxlength="16">
            <button class="sidework-circle" id="choreCircle" type="button">
              <span class="sidework-time" id="choreTime">00:00:00</span>
            </button>
          </div>
        </div>
        <div class="list-wrap">
          <main id="list" class="list"></main>
        </div>
        <div class="calendar-unplanned" id="taskUnplannedBox">
          <span class="calendar-unplanned-title">いつか</span>
          <div class="calendar-unplanned-list" id="taskUnplannedList"></div>
          <button type="button" class="calendar-someday-add" id="taskSomedayAddBtn" aria-label="いつかタスクを追加">＋</button>
        </div>
        <div class="someday-branch" id="taskSubtaskConnector" hidden></div>
        <div class="calendar-unplanned calendar-subtask-row" id="taskSubtaskBox" hidden>
          <span class="calendar-unplanned-title">子タスク</span>
          <div class="calendar-unplanned-list" id="taskSubtaskList"></div>
        </div>
        <div class="someday-branch" id="taskGrandchildConnector" hidden></div>
        <div class="calendar-unplanned calendar-subtask-row" id="taskGrandchildBox" hidden>
          <span class="calendar-unplanned-title">孫タスク</span>
          <div class="calendar-unplanned-list" id="taskGrandchildList"></div>
        </div>
        <div class="someday-branch" id="taskGreatGrandchildConnector" hidden></div>
        <div class="calendar-unplanned calendar-subtask-row" id="taskGreatGrandchildBox" hidden>
          <span class="calendar-unplanned-title">ひ孫タスク</span>
          <div class="calendar-unplanned-list" id="taskGreatGrandchildList"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="nameModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle">
    <h2 id="nameModalTitle">タスク名を入力</h2>
    <input id="nameModalInput" type="text" maxlength="24">
    <div class="modal-duration" id="nameModalDuration" hidden>
      <label class="duration-field">
        <span>時間</span>
        <input id="durationHoursInput" type="number" inputmode="numeric" min="0" max="23" step="1">
      </label>
      <label class="duration-field">
        <span>分</span>
        <input id="durationMinutesInput" type="number" inputmode="numeric" min="0" max="59" step="1">
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-modal-cancel" id="nameModalCancel" type="button">キャンセル</button>
      <button class="btn btn-modal-ok" id="nameModalOk" type="button">OK</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="somedayChoiceModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="somedayChoiceTitle">
    <h2 id="somedayChoiceTitle">操作を選択</h2>
    <div class="modal-actions modal-actions-stack">
      <button class="btn btn-modal-ok" id="somedayChoiceEditBtn" type="button">変更修正</button>
      <button class="btn btn-modal-ok" id="somedayChoiceAddChildBtn" type="button">子タスク追加</button>
      <button class="btn btn-modal-delete" id="somedayChoiceDeleteBtn" type="button">削除</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-modal-cancel" id="somedayChoiceCancelBtn" type="button">キャンセル</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="somedayDeleteChildrenModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="somedayDeleteChildrenTitle">
    <h2 id="somedayDeleteChildrenTitle">子タスクの扱いを選択</h2>
    <div class="modal-actions modal-actions-stack">
      <button class="btn btn-modal-ok" id="somedayDeleteKeepChildrenBtn" type="button">子タスク以下を残す</button>
      <button class="btn btn-modal-delete" id="somedayDeleteAllBtn" type="button">全て削除</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-modal-cancel" id="somedayDeleteChildrenCancelBtn" type="button">キャンセル</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="breakdownModal" hidden>
  <div class="modal-box modal-box-wide" role="dialog" aria-modal="true" aria-labelledby="breakdownModalTitle">
    <div class="modal-panel-header">
      <h2 id="breakdownModalTitle">内訳</h2>
      <button type="button" class="modal-close-btn" id="breakdownModalClose" aria-label="閉じる">&times;</button>
    </div>
    <div id="breakdown" class="breakdown"></div>
  </div>
</div>

<div class="modal-backdrop" id="historyModal" hidden>
  <div class="modal-box modal-box-wide" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle">
    <div class="modal-panel-header">
      <h2 id="historyModalTitle">履歴</h2>
      <button type="button" class="modal-close-btn" id="historyModalClose" aria-label="閉じる">&times;</button>
    </div>
    <div id="history" class="history"></div>
  </div>
</div>

<template id="rowTemplate">
  <section class="row">
    <input class="row-input" type="text" maxlength="24" placeholder="タスク名">
    <button class="row-time" type="button" title="タップして時間を手動追加">00:00:00</button>
    <button class="row-toggle" type="button">開始</button>
    <button class="row-reset" type="button" title="リセット">&#8635;</button>
    <button class="row-handle" type="button" title="ドラッグして並び替え" aria-label="並び替え">
      <span class="bars"><span></span><span></span><span></span></span>
    </button>
  </section>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="sync.js"></script>
<script src="script.js"></script>
</body>
</html>
