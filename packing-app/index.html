<meta charset="utf-8">
<title>持ち物見える化</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* レイアウト：スマホ1列。上にシーンのタブ（固定）、その下に場所カードが縦に並ぶ */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --fg: #23272a;
  --muted: #7b827f;
  --faint: #c3c8c4;
  --line: #e1e4e0;
  --accent: #2f6f62;
  --accent-soft: #dcebe6;
  --use: #b4542f;
  --use-soft: #f6e3da;
  /* 場所の色（名前ごとに固定で割り当て） */
  --p0-line: #3f7fb5; --p0-bg: #eaf2f9;
  --p1-line: #c08a1e; --p1-bg: #fbf3e2;
  --p2-line: #8a5fb0; --p2-bg: #f3edf8;
  --p3-line: #3c9a6b; --p3-bg: #e8f5ee;
  --p4-line: #c0566e; --p4-bg: #fbecef;
  --p5-line: #5d7a8c; --p5-bg: #edf2f5;
  --p6-line: #9a7a4f; --p6-bg: #f5efe6;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171a1a; --surface: #212525; --fg: #e6e9e7; --muted: #949c98; --faint: #555c59; --line: #323837;
    --accent: #7fc4b3; --accent-soft: #24403a; --use: #f0a07f; --use-soft: #47302a;
    --p0-line: #7cb4e3; --p0-bg: #1f2c38;
    --p1-line: #e3b75a; --p1-bg: #332c1c;
    --p2-line: #bb97dc; --p2-bg: #2c2535;
    --p3-line: #74cc9e; --p3-bg: #1d3128;
    --p4-line: #e78ea2; --p4-bg: #36232a;
    --p5-line: #9bb6c7; --p5-bg: #252e33;
    --p6-line: #cfae80; --p6-bg: #312a20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171a1a; --surface: #212525; --fg: #e6e9e7; --muted: #949c98; --faint: #555c59; --line: #323837;
  --accent: #7fc4b3; --accent-soft: #24403a; --use: #f0a07f; --use-soft: #47302a;
  --p0-line: #7cb4e3; --p0-bg: #1f2c38;
  --p1-line: #e3b75a; --p1-bg: #332c1c;
  --p2-line: #bb97dc; --p2-bg: #2c2535;
  --p3-line: #74cc9e; --p3-bg: #1d3128;
  --p4-line: #e78ea2; --p4-bg: #36232a;
  --p5-line: #9bb6c7; --p5-bg: #252e33;
  --p6-line: #cfae80; --p6-bg: #312a20;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 520px; margin: 0 auto; padding-bottom: 32px; }

/* ── 上部：予定名とタブ ── */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.trip { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 6px; }
.trip h1 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: .02em; }
.trip .kind { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }

.tabs {
  display: flex; gap: 6px;
  overflow-x: auto; scrollbar-width: none;
  padding: 6px 16px 10px;
  scroll-padding-inline: 16px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 99px;
  padding: 5px 12px;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; line-height: 1.25;
}
.tab .day { font-size: 10px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.tab[aria-selected="true"] .day { color: var(--surface); opacity: .85; }
.tab.past:not([aria-selected="true"]) { color: var(--muted); }

/* ── シーンの見出し ── */
.scene-head { padding: 14px 16px 4px; display: grid; gap: 6px; }
.scene-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.scene-title h2 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 700; text-wrap: balance; }
.step { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.uses { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.uses .chip { background: var(--use-soft); color: var(--use); border-radius: 6px; padding: 1px 7px; font-weight: 500; }
.legend { font-size: 11px; color: var(--muted); display: flex; justify-content: flex-end; gap: 4px; padding: 0 16px; }

/* ── 場所カード ── */
.places { display: grid; gap: 12px; padding: 8px 16px 0; }
.place {
  background: var(--surface);
  border-radius: 10px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--pl);
  overflow: hidden;
}
.place .place { border-radius: 8px; border-top: none; border-right: none; border-bottom: none; background: var(--pb); }
.place .place .place { background: var(--surface); }
.place-body .place { margin: 4px 0 6px; }
.place-head { display: flex; align-items: center; }
.toggle {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  border: 0; background: transparent; text-align: left;
  padding: 9px 4px 9px 10px; cursor: pointer;
}
.place > .place-head { background: var(--pb); }
.place .place > .place-head { background: transparent; }
.place .place > .place-head .toggle { padding: 6px 4px 6px 8px; }
.edit-btn {
  flex: none; border: 0; background: transparent; cursor: pointer;
  color: var(--muted); font-size: 14px; width: 36px; align-self: stretch;
}
.edit-btn:hover { color: var(--accent); }
.caret { width: 12px; flex: none; color: var(--pl); font-size: 11px; transition: transform .15s; }
.place[data-open="true"] > .place-head .caret { transform: rotate(90deg); }
.place-name { font-weight: 700; flex: 1; min-width: 0; }
.place .place .place-name { font-weight: 500; font-size: 14px; }
.place-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.place-body { padding: 2px 10px 6px 10px; }
.place .place .place-body { padding: 0 8px 4px 8px; }
.place[data-open="false"] > .place-body { display: none; }

/* ── アイテム行 ── */
.item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 2px;
  border-bottom: 1px solid var(--line);
  min-height: 36px;
}
.item { cursor: pointer; }
.item:hover .name { color: var(--accent); }
.item:last-child { border-bottom: 0; }
.place-body > .place + .item, .place-body > .item:has(+ .place) { border-bottom: 0; }
.type {
  flex: none; width: 18px; height: 18px; border-radius: 5px;
  font-size: 10px; line-height: 18px; text-align: center;
  color: var(--muted); border: 1px solid var(--faint);
}
.type.consume { border-style: dashed; }
.item .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.use-tag.rec { background: transparent; border: 1px solid var(--use); }
.use-tag { flex: none; font-size: 11px; color: var(--use); background: var(--use-soft); border-radius: 5px; padding: 0 5px; font-variant-numeric: tabular-nums; }
.nums { flex: none; display: flex; align-items: baseline; gap: 3px; font-variant-numeric: tabular-nums; min-width: 58px; justify-content: flex-end; }
.nums .u { font-size: 17px; font-weight: 700; min-width: 1.3em; text-align: right; }
.nums .sep { color: var(--faint); }
.nums .h { font-size: 13px; color: var(--muted); min-width: 1.3em; }
.nums.repeat { color: var(--accent); font-size: 16px; }
.item.done .name, .item.done .nums .u { color: var(--faint); }
.item.done .type { opacity: .5; }

/* ── 未配置・使い切り ── */
.unplaced { background: var(--surface); border: 1px dashed var(--faint); border-radius: 10px; padding: 8px 12px; }
.unplaced h3 { margin: 0 0 2px; font-size: 13px; color: var(--use); font-weight: 700; }
.unplaced .hint { font-size: 11px; color: var(--muted); margin: 0 0 4px; }
.gone { font-size: 12px; color: var(--muted); padding: 2px 4px; }
.gone b { font-weight: 500; }

/* ── 下部のシーン送り ── */
.pager { display: flex; justify-content: space-between; gap: 12px; padding: 16px; }
.pager button {
  flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 10px; font-size: 13px; cursor: pointer;
}
.pager button:disabled { opacity: .35; cursor: default; }

.key { margin: 4px 16px 0; padding: 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.key-row { display: flex; align-items: center; gap: 8px; }
.key-row .nums { min-width: 0; }
.sample { font-size: 11px; color: var(--muted); text-align: center; padding: 8px 16px 0; }


/* ── 編集シート（下から出るパネル） ── */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .35); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; max-height: 88%; overflow-y: auto;
  background: var(--surface); color: var(--fg);
  border-radius: 16px 16px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 16px;
}
.sheet h3 { margin: 0; font-family: var(--font-display); font-size: 18px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
.field input[type="text"] {
  font: inherit; font-size: 16px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%;
}
.field input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--bg); font-size: 22px; line-height: 1; cursor: pointer;
}
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper .val { min-width: 2.4em; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper .note { font-size: 12px; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button {
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 4px;
  font-size: 13px; cursor: pointer; display: grid; gap: 2px; line-height: 1.3;
}
.seg button small { font-size: 10px; color: var(--muted); }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.usebox { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 12px; }
.usebox .ttl { font-size: 13px; font-weight: 700; }
.linkish { border: 0; background: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline; }
.warn { font-size: 12px; color: var(--use); }
.sheet-actions { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.btn.danger { color: var(--use); border-color: var(--use-soft); background: transparent; }
.btn.danger.armed { background: var(--use); color: var(--surface); border-color: var(--use); }
.title-edit { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: inherit; display: inline-flex; align-items: baseline; gap: 6px; }
.title-edit .pen { font-size: 13px; color: var(--muted); font-weight: 400; }
.reset { display: flex; justify-content: center; padding: 8px 16px 0; }
.reset .btn { font-size: 12px; padding: 6px 12px; }

@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="trip"><h1><button type="button" class="title-edit" id="tripName"></button></h1><span class="kind" id="tripKind"></span></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="シーン"></nav>
  </header>
  <main id="scene"></main>
  <div class="pager">
    <button type="button" id="prev">← 前のシーン</button>
    <button type="button" id="next">次のシーン →</button>
  </div>
  <section class="key" aria-label="表示の見かた">
    <div class="key-row"><span class="nums"><span class="u">2</span><span class="sep">/</span><span class="h">3</span></span>未使用 / 手持ち（そのシーンを使い終えた時点）</div>
    <div class="key-row"><span class="type">帰</span>持ち帰り型：使っても手持ちは減らない</div>
    <div class="key-row"><span class="type consume">消</span>消耗型：使ったら手持ちも減る</div>
    <div class="key-row"><span class="nums repeat">♻︎</span>繰り返し型：何度使っても減らない</div>
    <div class="key-row"><span class="use-tag">−1</span>このシーンで使う予定の数</div>
    <div class="key-row"><span class="use-tag rec">−1</span>当日に記録した数（予定より優先）</div>
    <div class="key-row">アイテムをタップ、または場所の ✎ で名前や数を変えられます</div>
  </section>
  <p class="sample">試作版：変更はこの端末のブラウザに保存されます</p>
  <div class="reset"><button type="button" class="btn danger" id="reset">サンプルデータに戻す</button></div>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script>
// ───────── データの形 ─────────
// 指示書 7章（予定／シーン／アイテム／場所／配置／使用）に合わせています。
// 使用（usage）は planned（準備時の予定数）と actual（当日の記録）を持ち、actual があればそちらで計算します。

const TYPE = { BACK: 'back', CONSUME: 'consume', REPEAT: 'repeat' };
const TYPE_LABEL = {
  back:    ['持ち帰り型', '使っても手持ちは減らない'],
  consume: ['消耗型', '使ったら手持ちも減る'],
  repeat:  ['繰り返し型', '何度使っても減らない'],
};
const STORE_KEY = 'packing-app-v1';

// ───────── サンプルデータ：京都 2泊3日 ─────────
function sampleData() {
  function buildScenes(nights) {
    const s = [
      { name: '行きの移動', layout: 'transit' },
      { name: '1日目 日中', layout: 'day' },
      { name: '1日目 夕刻', layout: 'evening' },
    ];
    for (let d = 1; d <= nights; d++) {
      s.push({ name: `${d}日目 夜`, layout: 'room' });
      s.push({ name: `${d}日目 就寝時`, layout: 'room' });
      s.push({ name: `${d + 1}日目 朝`, layout: 'room' });
      s.push({ name: `${d + 1}日目 日中`, layout: 'day' });
    }
    s.push({ name: '帰りの移動', layout: 'transit' });
    return s.map((x, i) => ({ id: 's' + i, ...x }));
  }
  const scenes = buildScenes(2);

  const items = [
    ['tshirt',   'Tシャツ',           2, TYPE.BACK],
    ['under',    '下着',              2, TYPE.BACK],
    ['socks',    '靴下',              2, TYPE.BACK],
    ['hanky',    'ハンカチ',          3, TYPE.BACK],
    ['pajama',   'パジャマ',          1, TYPE.BACK],
    ['mask',     'マスク',            3, TYPE.CONSUME],
    ['kairo',    'カイロ',            4, TYPE.CONSUME],
    ['tissue',   'ポケットティッシュ', 2, TYPE.CONSUME],
    ['contact',  '使い捨てコンタクト', 2, TYPE.CONSUME],
    ['medicine', '頭痛薬',            4, TYPE.CONSUME],
    ['phone',    'スマホ',            1, TYPE.REPEAT],
    ['wallet',   '財布',              1, TYPE.REPEAT],
    ['charger',  '充電器',            1, TYPE.REPEAT],
    ['battery',  'モバイルバッテリー', 1, TYPE.REPEAT],
    ['umbrella', '折りたたみ傘',      1, TYPE.REPEAT],
    ['eyedrop',  '目薬',              1, TYPE.REPEAT],
    ['brush',    '歯ブラシ',          1, TYPE.REPEAT],
    ['wash',     '洗顔料',            1, TYPE.REPEAT],
  ].map(([id, name, n, type]) => ({ id, name, n, type }));

  const usagePlan = {
    '1日目 日中': { hanky: 1, mask: 1, kairo: 1 },
    '1日目 夜':   { under: 1 },
    '2日目 朝':   { tshirt: 1, socks: 1, contact: 1 },
    '2日目 日中': { hanky: 1, mask: 1, kairo: 2, tissue: 1 },
    '2日目 夜':   { under: 1, medicine: 1 },
    '3日目 朝':   { tshirt: 1, socks: 1, contact: 1 },
    '3日目 日中': { hanky: 1, mask: 1, kairo: 1 },
  };

  // 場所の並び（シーンの種類ごと）。入れ子は最大3段。
  const washPouch = { name: '洗面ポーチ', items: ['brush', 'wash'], children: [
    { name: '小袋', items: ['contact'] },
  ]};
  const handBag = (extra = []) => ({ name: '手提げ鞄', items: ['phone', 'wallet', 'hanky', 'mask', 'tissue', 'kairo', ...extra], children: [
    { name: '小物ポーチ', items: ['eyedrop', 'medicine', 'battery'] },
  ]});
  const bag = (extra = []) => ({ name: 'ボストンバッグ', items: ['tshirt', 'under', 'socks', 'pajama', ...extra], children: [washPouch] });
  const layouts = {
    transit: [bag(['charger']), handBag(['umbrella'])],
    day:     [handBag(['umbrella']), bag(['charger'])],
    // チェックイン直後：傘をどこに置いたか未記入 → 「未配置」の見本
    evening: [handBag(), bag(['charger'])],
    // ホテルの部屋：ポーチをボストンバッグから出して洗面台へ
    room: [
      { name: '洗面台', items: [], children: [washPouch] },
      { name: 'ベッドサイド', items: ['phone', 'charger', 'battery'] },
      { name: 'ボストンバッグ', items: ['tshirt', 'under', 'socks', 'pajama'] },
      { name: '手提げ鞄', items: ['wallet', 'hanky', 'mask', 'tissue', 'kairo', 'umbrella'], children: [
        { name: '小物ポーチ', items: ['eyedrop', 'medicine'] },
      ]},
    ],
  };

  const places = [], placements = [], usages = [];
  let pid = 0;
  function addPlace(scene, node, parentId, depth) {
    const id = 'p' + (pid++);
    places.push({ id, sceneId: scene.id, name: node.name, parentId, depth });
    (node.items || []).forEach(itemId => placements.push({ sceneId: scene.id, placeId: id, itemId }));
    (node.children || []).forEach(c => addPlace(scene, c, id, depth + 1));
  }
  scenes.forEach(scene => {
    layouts[scene.layout].forEach(node => addPlace(scene, node, null, 1));
    Object.entries(usagePlan[scene.name] || {}).forEach(([itemId, planned]) =>
      usages.push({ sceneId: scene.id, itemId, planned, actual: null }));
  });
  scenes.forEach(s => delete s.layout);

  return { trip: { name: '京都 2泊3日', kind: '旅行' }, scenes, items, places, placements, usages };
}

// ───────── 保存と読み込み（この端末のブラウザ内） ─────────
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* 保存領域が使えないときはサンプルで表示 */ }
  return sampleData();
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) { /* 保存できなくても表示は続ける */ }
}

let db = load();
const itemById = id => db.items.find(i => i.id === id);

// ───────── 計算 ─────────
function usageOf(sceneId, itemId) {
  return db.usages.find(x => x.sceneId === sceneId && x.itemId === itemId);
}
function usedIn(sceneId, itemId) {
  const u = usageOf(sceneId, itemId);
  return u ? (u.actual ?? u.planned) : 0;
}
// U = そのシーンまで（そのシーンを含む）に使った累計
function usedUpTo(item, sceneIdx) {
  let U = 0;
  for (let i = 0; i <= sceneIdx; i++) U += usedIn(db.scenes[i].id, item.id);
  return U;
}
function counts(item, sceneIdx) {
  if (item.type === TYPE.REPEAT) return { repeat: true, held: item.n };
  const U = Math.min(usedUpTo(item, sceneIdx), item.n);
  const unused = item.n - U;
  const held = item.type === TYPE.CONSUME ? item.n - U : item.n;
  return { unused, held };
}

// 同じ名前の場所はどのシーンでも同じ色
function colorMap() {
  const map = new Map();
  db.places.forEach(p => { if (!map.has(p.name)) map.set(p.name, map.size % 7); });
  return map;
}

// ───────── 表示 ─────────
let current = 0;
const openState = new Map(); // 「シーン:場所id」→ 開閉

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderTabs() {
  $('tabs').innerHTML = db.scenes.map((s, i) => {
    const m = s.name.match(/^(\d+日目) (.+)$/);
    const label = m ? `<span class="day">${m[1]}</span>${esc(m[2])}` : `<span class="day">&nbsp;</span>${esc(s.name)}`;
    return `<button type="button" role="tab" class="tab${i < current ? ' past' : ''}" aria-selected="${i === current}" data-i="${i}">${label}</button>`;
  }).join('');
  $('tabs').querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
}

function itemRow(item, idx, scene) {
  const c = counts(item, idx);
  const u = usageOf(scene.id, item.id);
  const use = u ? (u.actual ?? u.planned) : 0;
  const recorded = u && u.actual != null;
  const typeMark = item.type === TYPE.BACK ? '<span class="type" title="持ち帰り型">帰</span>'
    : item.type === TYPE.CONSUME ? '<span class="type consume" title="消耗型">消</span>'
    : '<span class="type" title="繰り返し型" style="visibility:hidden"></span>';
  const nums = c.repeat
    ? '<span class="nums repeat" aria-label="繰り返し型">♻︎</span>'
    : `<span class="nums" aria-label="未使用${c.unused} 手持ち${c.held}"><span class="u">${c.unused}</span><span class="sep">/</span><span class="h">${c.held}</span></span>`;
  const tag = (use || recorded) && !c.repeat ? `<span class="use-tag${recorded ? ' rec' : ''}">−${use}</span>` : '';
  const done = !c.repeat && c.unused === 0;
  return `<div class="item${done ? ' done' : ''}" role="button" tabindex="0" data-item="${esc(item.id)}">${typeMark}<span class="name">${esc(item.name)}</span>${tag}${nums}</div>`;
}

function renderScene() {
  const scene = db.scenes[current];
  const idx = current;
  const colors = colorMap();
  const scenePlaces = db.places.filter(p => p.sceneId === scene.id);
  const scenePlacements = db.placements.filter(p => p.sceneId === scene.id && itemById(p.itemId));
  const isGone = item => { const c = counts(item, idx); return !c.repeat && c.held === 0; };

  // 場所ごとの中身の点数（入れ子を含む、使い切ったものは除く）
  function total(place) {
    let n = scenePlacements.filter(x => x.placeId === place.id)
      .map(x => itemById(x.itemId)).filter(i => !isGone(i))
      .reduce((a, i) => a + counts(i, idx).held, 0);
    scenePlaces.filter(p => p.parentId === place.id).forEach(ch => n += total(ch));
    return n;
  }

  function placeHtml(place) {
    const key = scene.id + ':' + place.id;
    const open = openState.has(key) ? openState.get(key) : place.depth < 3;
    const col = colors.get(place.name);
    const rows = scenePlacements.filter(x => x.placeId === place.id)
      .map(x => itemById(x.itemId)).filter(i => !isGone(i))
      .map(i => itemRow(i, idx, scene)).join('');
    const kids = scenePlaces.filter(p => p.parentId === place.id).map(placeHtml).join('');
    return `<section class="place" data-open="${open}" style="--pl:var(--p${col}-line);--pb:var(--p${col}-bg)">
      <div class="place-head">
        <button type="button" class="toggle" data-key="${esc(key)}" aria-expanded="${open}">
          <span class="caret" aria-hidden="true">▶</span>
          <span class="place-name">${esc(place.name)}</span>
          <span class="place-count">${total(place)}点</span>
        </button>
        <button type="button" class="edit-btn" data-place="${esc(place.id)}" aria-label="${esc(place.name)}を編集">✎</button>
      </div>
      <div class="place-body">${rows}${kids}</div>
    </section>`;
  }

  const roots = scenePlaces.filter(p => !p.parentId).map(placeHtml).join('');

  const placedIds = new Set(scenePlacements.map(x => x.itemId));
  const unplaced = db.items.filter(i => !placedIds.has(i.id) && !isGone(i));
  const gone = db.items.filter(isGone);

  const useList = db.usages.filter(u => u.sceneId === scene.id && itemById(u.itemId) && (u.actual ?? u.planned) > 0)
    .map(u => `<span class="chip">${esc(itemById(u.itemId).name)} ${u.actual ?? u.planned}</span>`).join('');

  $('scene').innerHTML = `
    <div class="scene-head">
      <div class="scene-title">
        <h2><button type="button" class="title-edit" id="sceneTitle">${esc(scene.name)}<span class="pen" aria-label="シーン名を変更">✎</span></button></h2>
        <span class="step">${idx + 1} / ${db.scenes.length}</span>
      </div>
      <div class="uses">${useList ? 'このシーンで使う：' + useList : 'このシーンで使う予定のものはありません'}</div>
    </div>
    <div class="legend">右の数字は 未使用 / 手持ち</div>
    <div class="places">
      ${roots}
      ${unplaced.length ? `<div class="unplaced"><h3>未配置（${unplaced.length}点）</h3><p class="hint">このシーンでどの場所にも入っていません</p>${unplaced.map(i => itemRow(i, idx, scene)).join('')}</div>` : ''}
      ${gone.length ? `<div class="gone">使い切ったもの：${gone.map(i => `<b class="item-link" role="button" tabindex="0" data-item="${esc(i.id)}">${esc(i.name)}</b>`).join('、')}</div>` : ''}
    </div>`;

  $('prev').disabled = current === 0;
  $('next').disabled = current === db.scenes.length - 1;
}

function renderTrip() {
  $('tripName').innerHTML = `${esc(db.trip.name)}<span class="pen" aria-label="予定名を変更">✎</span>`;
  $('tripKind').textContent = db.trip.kind;
}

function renderAll() {
  renderTrip();
  renderTabs();
  renderScene();
}

function go(i) {
  current = Math.max(0, Math.min(db.scenes.length - 1, i));
  renderTabs();
  renderScene();
}

// 変更したら保存して描き直す（開いている編集シートはそのまま）
function commit() {
  save();
  renderTrip();
  renderTabs();
  renderScene();
}

// ───────── 編集シート ─────────
let sheet = null; // 今開いているシートの描き方

function openSheet(render) {
  sheet = render;
  $('sheetWrap').hidden = false;
  drawSheet();
  $('sheet').querySelector('input[type="text"]')?.focus({ preventScroll: true });
}
function drawSheet() {
  // 文字入力中のカーソルを保つため、入力欄は描き直さず値だけ残す
  const focused = document.activeElement?.id;
  $('sheet').innerHTML = sheet();
  if (focused && $(focused)) $(focused).focus({ preventScroll: true });
}
function closeSheet() {
  sheet = null;
  $('sheetWrap').hidden = true;
  $('sheet').innerHTML = '';
}

function stepper(act, value, { min = 0, note = '' } = {}) {
  return `<div class="stepper">
    <button type="button" data-act="${act}" data-d="-1" aria-label="1つ減らす" ${value <= min ? 'disabled' : ''}>−</button>
    <span class="val">${value}</span>
    <button type="button" data-act="${act}" data-d="1" aria-label="1つ増やす">＋</button>
    ${note ? `<span class="note">${note}</span>` : ''}
  </div>`;
}
const deleteArmed = { id: null };
function deleteButton(label, armedLabel, id) {
  const armed = deleteArmed.id === id;
  return `<button type="button" class="btn danger${armed ? ' armed' : ''}" data-act="delete">${armed ? armedLabel : label}</button>`;
}

// アイテムの編集
function itemSheet(itemId) {
  const scene = db.scenes[current];
  return () => {
    const item = itemById(itemId);
    if (!item) return '';
    const u = usageOf(scene.id, itemId);
    const planned = u?.planned ?? 0;
    const actual = u?.actual;
    const overUse = item.type !== TYPE.REPEAT && usedUpTo(item, db.scenes.length - 1) > item.n;
    const useBox = item.type === TYPE.REPEAT ? '' : `
      <div class="usebox">
        <div class="ttl">「${esc(scene.name)}」で使う数</div>
        <div class="field"><span class="lbl">予定（準備のときに入れる数）</span>${stepper('planned', planned)}</div>
        <div class="field"><span class="lbl">当日の記録（実際に使った数）</span>
          ${actual == null
            ? `${stepper('actual', planned, { note: '未記録：予定の数で計算中' })}`
            : `${stepper('actual', actual)}<button type="button" class="linkish" data-act="clearActual">記録を消して予定に戻す</button>`}
        </div>
        ${overUse ? `<div class="warn">全シーンで使う数の合計（${usedUpTo(item, db.scenes.length - 1)}）が総数（${item.n}）を超えています</div>` : ''}
      </div>`;
    return `
      <h3>アイテムを編集</h3>
      <div class="field"><label for="f-item-name">名前</label>
        <input type="text" id="f-item-name" value="${esc(item.name)}" data-act="itemName" autocomplete="off"></div>
      <div class="field"><span class="lbl">総数（持っていく数）</span>${stepper('itemN', item.n, { min: 1 })}</div>
      <div class="field"><span class="lbl">使い方のタイプ</span>
        <div class="seg">${Object.entries(TYPE_LABEL).map(([t, [name, sub]]) =>
          `<button type="button" data-act="itemType" data-t="${t}" aria-pressed="${item.type === t}">${name}<small>${sub}</small></button>`).join('')}</div>
      </div>
      ${useBox}
      <div class="sheet-actions">
        ${deleteButton('このアイテムを削除', 'もう一度押すと全シーンから削除', 'item:' + itemId)}
        <button type="button" class="btn primary" data-act="close">閉じる</button>
      </div>`;
  };
}

// 場所の編集
function placeSheet(placeId) {
  return () => {
    const place = db.places.find(p => p.id === placeId);
    if (!place) return '';
    const sameName = db.places.filter(p => p.name === place.name && p.id !== place.id).length;
    return `
      <h3>場所を編集</h3>
      <div class="field"><label for="f-place-name">名前</label>
        <input type="text" id="f-place-name" value="${esc(place.name)}" data-act="placeName" autocomplete="off"></div>
      ${sameName ? `<label class="check"><input type="checkbox" id="f-place-all" ${placeRenameAll ? 'checked' : ''} data-act="placeAll">
        ほかのシーンの同じ名前の場所（${sameName}か所）もまとめて変える</label>` : ''}
      <div class="sheet-actions">
        ${deleteButton('このシーンからこの場所を削除', 'もう一度押すと削除（中身は未配置へ）', 'place:' + placeId)}
        <button type="button" class="btn primary" data-act="close">閉じる</button>
      </div>`;
  };
}
let placeRenameAll = true;
let placeTargets = []; // 開いた時点で同じ名前だった場所

// シーン名・予定名の編集
function sceneSheet(sceneId) {
  return () => {
    const s = db.scenes.find(x => x.id === sceneId);
    return `
      <h3>シーン名を変更</h3>
      <div class="field"><label for="f-scene-name">名前</label>
        <input type="text" id="f-scene-name" value="${esc(s.name)}" data-act="sceneName" data-id="${esc(s.id)}" autocomplete="off"></div>
      <div class="sheet-actions"><span></span><button type="button" class="btn primary" data-act="close">閉じる</button></div>`;
  };
}
function tripSheet() {
  return `
    <h3>予定名を変更</h3>
    <div class="field"><label for="f-trip-name">名前</label>
      <input type="text" id="f-trip-name" value="${esc(db.trip.name)}" data-act="tripName" autocomplete="off"></div>
    <div class="sheet-actions"><span></span><button type="button" class="btn primary" data-act="close">閉じる</button></div>`;
}

let editing = null; // { kind: 'item'|'place', id }

function setUsage(sceneId, itemId, fn) {
  let u = usageOf(sceneId, itemId);
  if (!u) { u = { sceneId, itemId, planned: 0, actual: null }; db.usages.push(u); }
  fn(u);
  if (u.planned === 0 && u.actual == null) db.usages = db.usages.filter(x => x !== u);
}

$('sheet').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'INPUT') return;
  const act = b.dataset.act, d = +b.dataset.d || 0;
  const scene = db.scenes[current];
  if (act !== 'delete') deleteArmed.id = null;

  if (act === 'close') { closeSheet(); return; }

  if (editing?.kind === 'item') {
    const item = itemById(editing.id);
    if (act === 'itemN') item.n = Math.max(1, item.n + d);
    if (act === 'itemType') item.type = b.dataset.t;
    if (act === 'planned') setUsage(scene.id, item.id, u => { u.planned = Math.max(0, u.planned + d); });
    if (act === 'actual') setUsage(scene.id, item.id, u => { u.actual = Math.max(0, (u.actual ?? u.planned) + d); });
    if (act === 'clearActual') setUsage(scene.id, item.id, u => { u.actual = null; });
    if (act === 'delete') {
      const id = 'item:' + item.id;
      if (deleteArmed.id !== id) { deleteArmed.id = id; drawSheet(); return; }
      db.items = db.items.filter(i => i !== item);
      db.placements = db.placements.filter(p => p.itemId !== item.id);
      db.usages = db.usages.filter(u => u.itemId !== item.id);
      deleteArmed.id = null;
      closeSheet(); commit(); return;
    }
  }

  if (editing?.kind === 'place' && act === 'delete') {
    const id = 'place:' + editing.id;
    if (deleteArmed.id !== id) { deleteArmed.id = id; drawSheet(); return; }
    // 入れ子の中の場所もまとめて削除。中のアイテムは「未配置」になる
    const gone = new Set([editing.id]);
    let grew = true;
    while (grew) {
      grew = false;
      db.places.forEach(p => { if (p.parentId && gone.has(p.parentId) && !gone.has(p.id)) { gone.add(p.id); grew = true; } });
    }
    db.places = db.places.filter(p => !gone.has(p.id));
    db.placements = db.placements.filter(p => !gone.has(p.placeId));
    deleteArmed.id = null;
    closeSheet(); commit(); return;
  }

  commit();
  drawSheet();
});

$('sheet').addEventListener('input', e => {
  const t = e.target, act = t.dataset.act;
  if (act === 'itemName') { itemById(editing.id).name = t.value; }
  if (act === 'sceneName') { db.scenes.find(s => s.id === t.dataset.id).name = t.value; }
  if (act === 'tripName') { db.trip.name = t.value; }
  if (act === 'placeName') {
    const place = db.places.find(p => p.id === editing.id);
    const targets = placeRenameAll ? db.places.filter(p => placeTargets.includes(p.id)) : [place];
    targets.forEach(p => p.name = t.value);
  }
  if (act === 'placeAll') { placeRenameAll = t.checked; return; }
  commit();
});

// 背景をタップしたら閉じる
$('sheetWrap').addEventListener('click', e => { if (e.target === $('sheetWrap')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });

// ───────── 画面の操作 ─────────
function openItem(id) {
  editing = { kind: 'item', id };
  deleteArmed.id = null;
  openSheet(itemSheet(id));
}

$('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) go(+t.dataset.i);
});
$('scene').addEventListener('click', e => {
  const tog = e.target.closest('.toggle');
  if (tog) {
    const sec = tog.closest('.place');
    const open = sec.dataset.open !== 'true';
    sec.dataset.open = open;
    tog.setAttribute('aria-expanded', open);
    openState.set(tog.dataset.key, open);
    return;
  }
  const pe = e.target.closest('[data-place]');
  if (pe) {
    const place = db.places.find(p => p.id === pe.dataset.place);
    editing = { kind: 'place', id: place.id };
    placeTargets = db.places.filter(p => p.name === place.name).map(p => p.id);
    placeRenameAll = true;
    deleteArmed.id = null;
    openSheet(placeSheet(place.id));
    return;
  }
  const it = e.target.closest('[data-item]');
  if (it) { openItem(it.dataset.item); return; }
  if (e.target.closest('#sceneTitle')) {
    editing = { kind: 'scene' };
    openSheet(sceneSheet(db.scenes[current].id));
  }
});
$('scene').addEventListener('keydown', e => {
  const it = e.target.closest?.('[data-item]');
  if (it && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openItem(it.dataset.item); }
});
$('tripName').addEventListener('click', () => { editing = { kind: 'trip' }; openSheet(tripSheet); });
$('prev').addEventListener('click', () => go(current - 1));
$('next').addEventListener('click', () => go(current + 1));

// サンプルに戻す（2回押しで確定）
let resetArmed = false;
$('reset').addEventListener('click', () => {
  if (!resetArmed) {
    resetArmed = true;
    $('reset').textContent = 'もう一度押すと、変更をすべて消してサンプルに戻します';
    $('reset').classList.add('armed');
    return;
  }
  resetArmed = false;
  $('reset').textContent = 'サンプルデータに戻す';
  $('reset').classList.remove('armed');
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  db = sampleData();
  openState.clear();
  current = 0;
  renderAll();
});

renderAll();
</script>
